<title>Štátne lety Slovensko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Palette: cool instrument slate with an aeronautical-chart magenta.
   Light is the base; the two dark blocks redefine tokens only.
   --------------------------------------------------------------------------- */
:root {
  --ground: #ebeef1;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --ink: #131c25;
  --ink-2: #5c6e7e;
  --ink-3: #8496a4;
  --rule: #ccd5dc;
  --rule-strong: #a9b7c2;
  --accent: #b00060;
  --accent-soft: rgba(176, 0, 96, 0.10);
  --land: #dbe1e5;
  --land-edge: #b6c1c9;
  --border-line: #aab6bf;
  --ok: #1c6f53;
  --ok-soft: rgba(28, 111, 83, 0.12);
  --warn: #8a5f09;
  --warn-soft: rgba(138, 95, 9, 0.14);
  --weak: #9c4b3a;
  --weak-soft: rgba(156, 75, 58, 0.13);
  --none: #b3bfc8;

  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --wide: 1160px;
  --prose: 64ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e151c;
    --surface: #17212b;
    --surface-2: #1d2833;
    --ink: #dfe6ec;
    --ink-2: #94a5b3;
    --ink-3: #6d7f8d;
    --rule: #27333e;
    --rule-strong: #3a4a58;
    --accent: #ff62a6;
    --accent-soft: rgba(255, 98, 166, 0.14);
    --land: #212e39;
    --land-edge: #35434f;
    --border-line: #3f4e5b;
    --ok: #4fbf95;
    --ok-soft: rgba(79, 191, 149, 0.14);
    --warn: #d2a33f;
    --warn-soft: rgba(210, 163, 63, 0.15);
    --weak: #d98570;
    --weak-soft: rgba(217, 133, 112, 0.15);
    --none: #3d4d5a;
  }
}

:root[data-theme="dark"] {
  --ground: #0e151c;
  --surface: #17212b;
  --surface-2: #1d2833;
  --ink: #dfe6ec;
  --ink-2: #94a5b3;
  --ink-3: #6d7f8d;
  --rule: #27333e;
  --rule-strong: #3a4a58;
  --accent: #ff62a6;
  --accent-soft: rgba(255, 98, 166, 0.14);
  --land: #212e39;
  --land-edge: #35434f;
  --border-line: #3f4e5b;
  --ok: #4fbf95;
  --ok-soft: rgba(79, 191, 149, 0.14);
  --warn: #d2a33f;
  --warn-soft: rgba(210, 163, 63, 0.15);
  --weak: #d98570;
  --weak-soft: rgba(217, 133, 112, 0.15);
  --none: #3d4d5a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--wide); margin: 0 auto; padding: 0 24px; }
.prose { max-width: var(--prose); }

h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

.eyebrow {
  font-family: var(--data);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--data); font-variant-numeric: tabular-nums; }

/* --- masthead ------------------------------------------------------------ */
header.masthead { border-bottom: 1px solid var(--rule-strong); background: var(--surface); }
header.masthead .wrap { padding-block: 56px 40px; display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); align-items: end; }

.wordmark { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 6.2vw, 68px); line-height: 0.98; letter-spacing: -0.025em; }
.wordmark span { display: block; color: var(--ink-3); }
.thesis { margin-top: 20px; font-size: 17px; color: var(--ink-2); max-width: 46ch; }
.thesis strong { color: var(--ink); font-weight: 500; }

.embargo {
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  background: var(--surface-2);
  padding: 16px 18px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
}
.embargo .eyebrow { display: block; margin-bottom: 8px; color: var(--accent); }

/* --- sections ------------------------------------------------------------ */
section { padding-block: 52px; border-bottom: 1px solid var(--rule); }
section > .wrap > .sec-head { margin-bottom: 28px; }
.sec-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.012em; margin-top: 6px; }
.sec-head p { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; max-width: var(--prose); }

/* --- KPI ----------------------------------------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.kpi { background: var(--surface); padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 0.44em; font-weight: 600; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.kpi .v.unavailable { font-size: 20px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; font-family: var(--body); line-height: 1.25; }
.kpi .note { font-size: 12.5px; color: var(--ink-3); }

/* --- coverage grid ------------------------------------------------------- */
/* --- backfill progress ------------------------------------------------------
   Visible only while the record is still being filled. A reader who cannot see that
   January has not been read yet has no way to tell a quiet month from an unread one —
   which is the same confusion the coverage calendar exists to prevent, one level up. */
.backfill { background: var(--surface); border-bottom: 1px solid var(--rule); }
.backfill .wrap { padding-block: 14px 16px; }
.backfill .eyebrow { margin-bottom: 9px; }
.bf-bar {
  height: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule);
  overflow: hidden;
}
.bf-bar span {
  display: block; height: 100%; width: 0; background: var(--accent);
  transition: width 600ms ease;
}
.bf-note {
  margin-top: 9px; font-family: var(--data); font-size: 11.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.bf-note b { color: var(--ink); font-weight: 600; }

/* --- coverage calendar ----------------------------------------------------
   This is the first thing on the page and the way into everything else, so it has to
   carry weight at 44 days and still be legible at several years.

   The grid is week columns × weekday rows, sized in fractions rather than pixels: cells
   grow to a comfortable 30px while the record is short and shrink as the years
   accumulate, so a decade lands inside the same column instead of scrolling off it.
   Counts sit beside the grid rather than under it — with seven weeks of data a
   full-width strip of squares would be empty theatre, and the numbers are the part that
   actually says how complete the record is. */
.cov-panel {
  display: grid; grid-template-columns: minmax(0, auto) minmax(190px, 260px);
  gap: 32px 44px; align-items: start;
  border: 1px solid var(--rule); background: var(--surface); padding: 26px 28px;
  /* The card takes the width its content needs, so seven weeks do not sit in a
     full-width box with a hole in the middle. It grows with the record until a year
     fills the column on its own. */
  width: fit-content; max-width: 100%;
}
@media (max-width: 820px) { .cov-panel { grid-template-columns: minmax(0, 1fr); } }

.cov-years { display: flex; flex-direction: column; gap: 22px; min-width: 0; overflow-x: auto; }
.cov-year > h3 {
  margin: 0 0 8px; font-family: var(--data); font-size: 11px; font-weight: 600;
  letter-spacing: 0.16em; color: var(--ink-3);
}
.cov-grid {
  --cov-gap: 4px; --cov-max: 40px;
  display: grid;
  /* Each week column wants --cov-max and will give ground down to 9px under pressure:
     comfortable while the record is short, still legible across a full year, and past
     that the container scrolls rather than shrinking a day out of reach. A fraction
     would have no preferred size at all and collapse the moment the card fits content. */
  grid-template-columns: auto repeat(var(--weeks), minmax(9px, var(--cov-max)));
  grid-template-rows: auto repeat(7, auto);
  gap: var(--cov-gap);
}
.cov-dow {
  grid-column: 1; font-family: var(--data); font-size: 9px; color: var(--ink-3);
  align-self: center; padding-right: 4px; text-align: right;
}
.cov-mon {
  grid-row: 1; font-family: var(--data); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-3); white-space: nowrap; align-self: end;
}

.cov-day {
  aspect-ratio: 1; width: 100%; padding: 0; border: 0; border-radius: 2px;
  background: var(--surface-2); cursor: pointer; display: block;
}
.cov-day[data-state="outside"] { background: transparent; cursor: default; }
/* Read but empty is a finding; not yet read is not. The dotted outline says "no claim". */
.cov-day[data-state="pending"] { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.cov-day[data-state="quiet"] { background: var(--none); }
.cov-day[data-state="nodata"] {
  background: repeating-linear-gradient(45deg, var(--weak-soft), var(--weak-soft) 3px, transparent 3px, transparent 6px);
  box-shadow: inset 0 0 0 1px var(--weak-soft);
}
.cov-day[data-state="partial"] { background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn); }
/* Flight count reads through opacity: one flight and six should not look the same. */
.cov-day[data-state="flew"] { background: var(--accent); opacity: 0.5; }
.cov-day[data-state="flew"][data-load="2"] { opacity: 0.75; }
.cov-day[data-state="flew"][data-load="3"] { opacity: 1; }
.cov-day:hover:not([data-state="outside"]) { box-shadow: inset 0 0 0 2px var(--ink); }
.cov-day:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cov-day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

/* --- counts beside the grid ------------------------------------------------ */
.cov-period {
  margin: 0 0 16px; font-family: var(--data); font-size: 11px; letter-spacing: 0.06em;
  color: var(--ink-3); text-transform: uppercase;
}
.cov-stats { margin: 0; display: grid; gap: 11px; }
.cov-stat { display: grid; grid-template-columns: 14px auto 1fr; gap: 10px; align-items: baseline; }
.cov-stat i { width: 12px; height: 12px; border-radius: 2px; display: block; align-self: center;
  background: var(--surface-2); }
.cov-stat dd {
  margin: 0; font-family: var(--data); font-variant-numeric: tabular-nums;
  font-size: 19px; font-weight: 600; line-height: 1; color: var(--ink);
}
.cov-stat dt { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }

/* --- selected day --------------------------------------------------------- */
.cov-detail {
  margin-top: 18px; border: 1px solid var(--rule); border-left: 3px solid var(--accent);
  background: var(--surface); padding: 16px 18px; display: none;
}
.cov-detail[data-open="1"] { display: block; }
.cov-detail-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  justify-content: space-between; }
.cov-detail-head b { font-family: var(--display); font-size: 17px; }
.cov-detail-head .verdict { font-size: 13px; color: var(--ink-2); flex: 1 1 260px; }
.cov-clear { font-family: var(--data); font-size: 11px; letter-spacing: 0.08em;
  background: none; border: 1px solid var(--rule); padding: 4px 9px; cursor: pointer;
  color: var(--ink-2); }
.cov-clear:hover { border-color: var(--ink); color: var(--ink); }
.cov-rows { margin-top: 14px; display: grid; gap: 6px; }
.cov-row { display: grid; grid-template-columns: 92px 14px 1fr; gap: 10px; align-items: center;
  font-size: 13px; }
.cov-row .reg { font-family: var(--data); font-weight: 500; }
.cov-row .what { color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.cov-leg { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none;
  border-bottom: 1px solid var(--rule); color: var(--ink); }
.cov-leg:hover { border-bottom-color: var(--accent); color: var(--accent); }
.cov-leg b { font-family: var(--data); font-weight: 600; font-size: 12.5px; letter-spacing: 0.02em; }
.cov-leg em { font-style: normal; font-size: 12px; color: var(--ink-3); }

/* One swatch definition for every place a state is named — the counts beside the grid and
   the per-aircraft rows below them. Scoping these under a parent is how the detail panel
   silently lost its colours when the legend it borrowed them from was removed. */
.cov-sw { width: 12px; height: 12px; display: block; border-radius: 2px; background: var(--surface-2); }
.cov-sw[data-state="flew"] { background: var(--accent); }
.cov-sw[data-state="quiet"] { background: var(--none); }
.cov-sw[data-state="partial"] { background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn); }
.cov-sw[data-state="pending"] { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.cov-sw[data-state="nodata"] {
  background: repeating-linear-gradient(45deg, var(--weak-soft), var(--weak-soft) 3px, transparent 3px, transparent 6px);
  box-shadow: inset 0 0 0 1px var(--weak-soft);
}

/* --- fleet --------------------------------------------------------------- */
/* A fixed three-column module, not auto-fit. With auto-fit a group of two would stretch
   its cards to half the page and the rhythm would break between the two fleets. Real
   gutters and a border per card, so a group that does not fill its last row leaves clean
   space rather than a block of the gap colour. */
.fleet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .fleet { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .fleet { grid-template-columns: minmax(0, 1fr); } }

.ac { background: var(--surface); border: 1px solid var(--rule); display: flex; flex-direction: column; }
.ac figure { margin: 0; position: relative; }
/* Fitted into the band, never cropped — a cover crop took the nose off the panoramic one. */
.ac img { width: 100%; aspect-ratio: 3 / 2; height: auto; display: block; background: var(--surface-2); }
.ac figcaption {
  position: absolute; left: 0; bottom: 0;
  font-family: var(--data); font-size: 9.5px; letter-spacing: 0.02em;
  color: #fff; background: rgba(12, 20, 28, 0.62);
  padding: 3px 8px 4px; max-width: 100%;
}
.ac figcaption a { color: inherit; text-decoration: none; }
.ac figcaption a:hover { text-decoration: underline; }

.ac-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.ac .reg { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -0.022em; }
.ac .type { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.ac .type em { font-style: normal; color: var(--ink-3); }
.ac .stat {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule);
  font-family: var(--data); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.ac .stat b { color: var(--ink); font-weight: 600; }
.ac .no-photo { margin: 0; aspect-ratio: 3 / 2; border: 0; border-bottom: 1px solid var(--rule); background: var(--surface-2); }
.tag { align-self: flex-start; margin-top: 10px; font-family: var(--data); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag.unverified { color: var(--warn); }
.tag.retired { color: var(--ink-3); }
</style>
