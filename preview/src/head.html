<title>Štátne lety Slovensko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Palette: cool instrument slate with an aeronautical-chart magenta.
   Light is the base; the two dark blocks redefine tokens only.
   --------------------------------------------------------------------------- */
:root {
  --ground: #ebeef1;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --ink: #131c25;
  --ink-2: #5c6e7e;
  --ink-3: #8496a4;
  --rule: #ccd5dc;
  --rule-strong: #a9b7c2;
  --accent: #b00060;
  --accent-soft: rgba(176, 0, 96, 0.10);
  --land: #dbe1e5;
  --land-edge: #b6c1c9;
  --border-line: #aab6bf;
  --ok: #1c6f53;
  --ok-soft: rgba(28, 111, 83, 0.12);
  --warn: #8a5f09;
  --warn-soft: rgba(138, 95, 9, 0.14);
  --weak: #9c4b3a;
  --weak-soft: rgba(156, 75, 58, 0.13);
  --none: #b3bfc8;

  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --wide: 1160px;
  --prose: 64ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e151c;
    --surface: #17212b;
    --surface-2: #1d2833;
    --ink: #dfe6ec;
    --ink-2: #94a5b3;
    --ink-3: #6d7f8d;
    --rule: #27333e;
    --rule-strong: #3a4a58;
    --accent: #ff62a6;
    --accent-soft: rgba(255, 98, 166, 0.14);
    --land: #212e39;
    --land-edge: #35434f;
    --border-line: #3f4e5b;
    --ok: #4fbf95;
    --ok-soft: rgba(79, 191, 149, 0.14);
    --warn: #d2a33f;
    --warn-soft: rgba(210, 163, 63, 0.15);
    --weak: #d98570;
    --weak-soft: rgba(217, 133, 112, 0.15);
    --none: #3d4d5a;
  }
}

:root[data-theme="dark"] {
  --ground: #0e151c;
  --surface: #17212b;
  --surface-2: #1d2833;
  --ink: #dfe6ec;
  --ink-2: #94a5b3;
  --ink-3: #6d7f8d;
  --rule: #27333e;
  --rule-strong: #3a4a58;
  --accent: #ff62a6;
  --accent-soft: rgba(255, 98, 166, 0.14);
  --land: #212e39;
  --land-edge: #35434f;
  --border-line: #3f4e5b;
  --ok: #4fbf95;
  --ok-soft: rgba(79, 191, 149, 0.14);
  --warn: #d2a33f;
  --warn-soft: rgba(210, 163, 63, 0.15);
  --weak: #d98570;
  --weak-soft: rgba(217, 133, 112, 0.15);
  --none: #3d4d5a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--wide); margin: 0 auto; padding: 0 24px; }
.prose { max-width: var(--prose); }

h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

.eyebrow {
  font-family: var(--data);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--data); font-variant-numeric: tabular-nums; }

/* --- preview banner ------------------------------------------------------ */
.preview-note {
  background: var(--accent-soft);
  border-bottom: 1px solid var(--rule);
  font-family: var(--data);
  font-size: 12px;
  color: var(--ink-2);
}
.preview-note .wrap { padding-block: 9px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.preview-note b { color: var(--accent); font-weight: 600; letter-spacing: 0.06em; }

/* --- masthead ------------------------------------------------------------ */
header.masthead { border-bottom: 1px solid var(--rule-strong); background: var(--surface); }
header.masthead .wrap { padding-block: 56px 40px; display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); align-items: end; }

.wordmark { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 6.2vw, 68px); line-height: 0.98; letter-spacing: -0.025em; }
.wordmark span { display: block; color: var(--ink-3); }
.thesis { margin-top: 20px; font-size: 17px; color: var(--ink-2); max-width: 46ch; }
.thesis strong { color: var(--ink); font-weight: 500; }

.embargo {
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  background: var(--surface-2);
  padding: 16px 18px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
}
.embargo .eyebrow { display: block; margin-bottom: 8px; color: var(--accent); }

/* --- sections ------------------------------------------------------------ */
section { padding-block: 52px; border-bottom: 1px solid var(--rule); }
section > .wrap > .sec-head { margin-bottom: 28px; }
.sec-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.012em; margin-top: 6px; }
.sec-head p { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; max-width: var(--prose); }

/* --- KPI ----------------------------------------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.kpi { background: var(--surface); padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 0.44em; font-weight: 600; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.kpi .v.unavailable { font-size: 20px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; font-family: var(--body); line-height: 1.25; }
.kpi .note { font-size: 12.5px; color: var(--ink-3); }

/* --- coverage grid ------------------------------------------------------- */
.cov-scroll { overflow-x: auto; padding-bottom: 6px; }
.cov { border-collapse: separate; border-spacing: 0; font-family: var(--data); font-size: 11px; }
.cov th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 0 10px 8px 0; white-space: nowrap; }
.cov td { padding: 0; }
.cov .cell { width: 15px; height: 22px; border-right: 1px solid var(--surface); display: block; }
.cov .reg { padding-right: 14px; white-space: nowrap; font-weight: 500; }
.cov .month-label { width: 15px; padding: 0 0 4px; position: relative; height: 16px; }
.cov .month-label b { position: absolute; left: 0; bottom: 4px; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.c-flew { background: var(--accent); }
.c-quiet { background: var(--none); }
.c-nodata { background: repeating-linear-gradient(45deg, var(--weak-soft), var(--weak-soft) 3px, transparent 3px, transparent 6px); box-shadow: inset 0 0 0 1px var(--weak-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 18px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 22px; height: 12px; display: block; flex: none; }

/* --- fleet --------------------------------------------------------------- */
/* A fixed three-column module, not auto-fit. With auto-fit a group of two would stretch
   its cards to half the page and the rhythm would break between the two fleets. Real
   gutters and a border per card, so a group that does not fill its last row leaves clean
   space rather than a block of the gap colour. */
.fleet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .fleet { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .fleet { grid-template-columns: minmax(0, 1fr); } }

.ac { background: var(--surface); border: 1px solid var(--rule); display: flex; flex-direction: column; }
.ac figure { margin: 0; position: relative; }
/* Fitted into the band, never cropped — a cover crop took the nose off the panoramic one. */
.ac img { width: 100%; aspect-ratio: 3 / 2; height: auto; display: block; background: var(--surface-2); }
.ac figcaption {
  position: absolute; left: 0; bottom: 0;
  font-family: var(--data); font-size: 9.5px; letter-spacing: 0.02em;
  color: #fff; background: rgba(12, 20, 28, 0.62);
  padding: 3px 8px 4px; max-width: 100%;
}
.ac figcaption a { color: inherit; text-decoration: none; }
.ac figcaption a:hover { text-decoration: underline; }

.ac-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.ac .reg { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -0.022em; }
.ac .type { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.ac .type em { font-style: normal; color: var(--ink-3); }
.ac .stat {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule);
  font-family: var(--data); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.ac .stat b { color: var(--ink); font-weight: 600; }
.ac .no-photo { margin: 0; aspect-ratio: 3 / 2; border: 0; border-bottom: 1px solid var(--rule); background: var(--surface-2); }
.tag { align-self: flex-start; margin-top: 10px; font-family: var(--data); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag.unverified { color: var(--warn); }
.tag.retired { color: var(--ink-3); }
</style>
