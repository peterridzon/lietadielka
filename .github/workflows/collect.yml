name: Denný zber

# The provider keeps roughly 40 days of history. A gap longer than that is permanent, so
# this runs every day whether or not anyone is watching — that is the whole point.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # commits the new observations

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the npm that wrote package-lock.json: npm 10 lays the nested
          # esbuild copies out differently and `npm ci` then rejects the lockfile.
          node-version: '26'
          cache: npm

      # Reference data and provider responses are regenerable, so a cache miss costs time
      # rather than correctness.
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: adsb-cache-${{ github.run_id }}
          restore-keys: adsb-cache-

      - run: npm ci

      # The runner starts empty. Everything is rebuilt from what is committed: the
      # registry, the sourced cost figures, and the raw observations themselves.
      - name: Restore state from the repository
        run: |
          npm run db:migrate
          npm run seed
          npm run airports:import
          npm run obs:import

      - name: Collect
        run: |
          # Recent days are re-fetched: a trace can still be filling in, and a day written
          # off as empty too early would stay empty for ever.
          npx tsx src/cli/adsb-backfill.ts --all \
            --from "$(date -u -d '3 days ago' +%F)" --to "$(date -u -d 'yesterday' +%F)" \
            --concurrency 6 --force
          # Then anything untouched since the last run. Already-imported days are skipped,
          # so a long gap costs one pass rather than one run per missed day.
          npx tsx src/cli/adsb-backfill.ts --all \
            --from "$(date -u -d '39 days ago' +%F)" --to "$(date -u -d '4 days ago' +%F)" \
            --concurrency 6

      - name: Rebuild everything derived
        run: |
          npm run obs:export
          npm run flights:rebuild -- --all
          npm run missions:rebuild
          npm run costs:recompute
          # Re-attaches the hand-entered flight purposes to the rebuilt flights.
          npm run seed

      # Nothing is published if the pipeline is broken.
      - run: npm test

      # public/ is generated, and committing generated output is normally a smell. Here
      # it is the deploy: Cloudflare Pages watches this repository and serves whatever
      # lands in public/, so no token has to live in GitHub. For a project whose point is
      # auditability, having the exact published page in the history is worth the
      # duplication.
      - name: Build the page
        run: |
          npm run preview:build
          mkdir -p public
          cp preview/state-flights-preview.html public/index.html

      - name: Commit the new observations and the page
        run: |
          git config user.name 'lietadielka-collector'
          git config user.email 'noreply@users.noreply.github.com'
          git add data/observations preview/src/export.json preview/state-flights-preview.html public/index.html
          if git diff --cached --quiet; then
            echo 'Nič nové — žiadny commit.'
          else
            git commit -m "data: zber $(date -u +%F)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## Zber'
            echo '```'
            npx tsx src/cli/imports-list.ts 2>/dev/null | head -14 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

