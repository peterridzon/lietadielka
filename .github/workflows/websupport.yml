name: Nahrať na WebSupport

# Optional. Only needed if the page should live on WebSupport rather than on GitHub Pages.
# Set WS_HOST, WS_USER, WS_PASSWORD and WS_PATH as repository secrets; without them this
# workflow does nothing.
on:
  workflow_run:
    workflows: ['Denný zber']
    types: [completed]
  workflow_dispatch:

jobs:
  upload:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload over FTPS
        env:
          WS_HOST: ${{ secrets.WS_HOST }}
          WS_USER: ${{ secrets.WS_USER }}
          WS_PASSWORD: ${{ secrets.WS_PASSWORD }}
          WS_PATH: ${{ secrets.WS_PATH }}
        run: |
          if [ -z "$WS_HOST" ]; then
            echo 'WS_HOST nie je nastavené — preskakujem. Stránka beží na GitHub Pages.'
            exit 0
          fi
          curl --fail --ssl-reqd --ftp-create-dirs \
            -T preview/state-flights-preview.html \
            -u "$WS_USER:$WS_PASSWORD" \
            "ftp://$WS_HOST/${WS_PATH#/}/index.html"
          echo 'Nahraté.'
