services:
  db:
    image: postgres:17-alpine
    container_name: lietadielka-db
    environment:
      POSTGRES_USER: lietadielka
      POSTGRES_PASSWORD: lietadielka
      POSTGRES_DB: lietadielka
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lietadielka']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
